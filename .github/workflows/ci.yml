name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout NestWeb OpenAPI contract
        uses: actions/checkout@v4
        with:
          repository: Gan-Xing/NestWeb
          ref: main
          path: .ci/NestWeb

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Verify OpenAPI client is current
        run: pnpm run openapi:nest:check
        env:
          OPENAPI_SCHEMA_URL: ${{ github.workspace }}/.ci/NestWeb/docs/openapi/nestweb.openapi.json

      - name: Verify i18n locales are current
        run: pnpm run i18n:check

      - name: Typecheck
        run: pnpm run tsc

      - name: Test
        run: pnpm test -- --runInBand

      - name: Build
        run: pnpm run build
